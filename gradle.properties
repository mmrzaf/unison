# Maven Central rate-limits the shared CI runner addresses (HTTP 429) when several cold jobs resolve at once;
# Gradle's default of 3 attempts and 1 s back-off gives up before the limit lifts.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dorg.gradle.internal.network.retry.max.attempts=8 -Dorg.gradle.internal.network.retry.initial.backOff=2000
org.gradle.parallel=true
org.gradle.tooling.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Integrate code/resource reachability in R8 for smaller release APKs (AGP 8.12/8.13).
android.r8.optimizedResourceShrinking=true
