name: Android CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Prepare pinned standalone Kotlin checks
        run: ./gradlew --no-daemon :app:prepareStandaloneKotlinChecks

      - name: Verify repository
        run: |
          ./scripts/check-static.sh
          ./scripts/check-core.sh
          ./scripts/check-data.sh
          ./scripts/check-risky-kotlin.sh
          ./scripts/check-player-kotlin.sh
          ./scripts/check-session-player-kotlin.sh
          ./scripts/check-release-quality.sh

      - name: Apply runner-only lint compatibility policy
        run: cp .github/lint-ci.xml app/lint.xml

      - name: Test, lint, and build APKs
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease

      - name: Name debug APK
        id: debug_apk
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          apk_stem="Unison-debug-${short_sha}"

          apk_path="app/build/outputs/apk/debug/${apk_stem}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "$apk_path"

          echo "artifact_name=$apk_stem" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.debug_apk.outputs.artifact_name }}
          path: ${{ steps.debug_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: Unison-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
