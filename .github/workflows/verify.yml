name: Reusable Android verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Repository, unit, lint, and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          add-job-summary: on-failure

      - name: Install repository lint tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          ./scripts/install-ci-tooling.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check shell, workflow, and Python tooling
        run: ./scripts/check-tooling.sh

      - name: Prepare pinned standalone Kotlin checks
        run: ./gradlew --no-daemon :app:prepareStandaloneKotlinChecks

      - name: Verify repository
        run: ./scripts/check-release-quality.sh

      - name: Formatting, unit tests, lint, and APK compilation
        run: >-
          ./gradlew --no-daemon --stacktrace
          spotlessCheck testDebugUnitTest lintDebug lintRelease
          assembleDebug assembleRelease
          :app:compileDebugAndroidTestKotlin

      - name: Name debug APK
        id: debug_apk
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          apk_stem="Unison-debug-${short_sha}"
          apk_path="app/build/outputs/apk/debug/${apk_stem}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "$apk_path"
          echo "artifact_name=$apk_stem" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.debug_apk.outputs.artifact_name }}
          path: ${{ steps.debug_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Unison-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
