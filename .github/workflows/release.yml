name: Publish Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching versionName, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: unison-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Validate release tag and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$version_name"
          test "$RELEASE_TAG" = "v$version_name" || {
            echo "Tag $RELEASE_TAG does not match app version $version_name" >&2
            exit 1
          }
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unison-release.jks"
          chmod 600 "$RUNNER_TEMP/unison-release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/unison-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          chmod 600 keystore.properties

      - name: Verify repository
        run: ./scripts/check-static.sh

      - name: Test, lint, and build signed APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintRelease assembleRelease

      - name: Verify and stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          version_name="${RELEASE_TAG#v}"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"

          mkdir -p dist
          cp "$apk" "dist/Unison-${version_name}.apk"
          (
            cd dist
            sha256sum "Unison-${version_name}.apk" > SHA256SUMS.txt
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Unison-${{ env.RELEASE_TAG }}
          path: |
            dist/Unison-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name="${RELEASE_TAG#v}"
          assets=(
            "dist/Unison-${version_name}.apk"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "Unison ${version_name}" --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Unison ${version_name}" \
              --generate-notes \
              --latest
          fi
