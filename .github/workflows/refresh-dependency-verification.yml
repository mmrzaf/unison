name: Refresh dependency verification metadata

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/refresh-dependency-verification.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'scripts/refresh-dependency-verification.sh'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Resolve official dependencies and export SHA-256 metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          add-job-summary: on-failure

      - name: Refresh SHA-256 verification metadata
        run: ./scripts/refresh-dependency-verification.sh

      - name: Validate generated metadata
        run: python3 ./scripts/check-dependency-verification.py

      - name: Commit verified metadata to develop
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "Dependency verification metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git diff --cached --check
          git commit -m "chore(build): refresh Gradle dependency verification metadata"
          git push origin HEAD:develop

      - name: Upload metadata for review and commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 14
