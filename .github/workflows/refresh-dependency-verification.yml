name: Refresh dependency verification metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Resolve official dependencies and export SHA-256 metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          add-job-summary: on-failure

      - name: Refresh SHA-256 verification metadata
        run: ./scripts/refresh-dependency-verification.sh

      - name: Validate generated metadata
        run: python3 ./scripts/check-dependency-verification.py

      - name: Upload metadata for review and commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 14
